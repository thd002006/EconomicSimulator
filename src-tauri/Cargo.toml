[package]
name = "economic-simulator"
version = "0.1.0"
description = "Economic Simulator desktop shell"
authors = ["Economic Simulator contributors"]
edition = "2021"

[lib]
name = "economic_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
